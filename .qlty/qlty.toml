config_version = "0"

exclude_patterns = [
  "**/vendor/**",
  "**/node_modules/**",
]

test_patterns = [
  "**/tests/**",
  "**/*Test.php",
  "**/Pest.php",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "phpstan"
mode = "comment"
config_files = ["phpstan.neon"]

[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "osv-scanner"
mode = "block"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "actionlint"
mode = "comment"
