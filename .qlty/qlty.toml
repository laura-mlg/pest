# This configuration was generated with the setup-qlty-toml skill.
# For reference: https://docs.qlty.sh/qlty-toml
config_version = "0"

exclude_patterns = [
  "**/vendor/**",
  "**/node_modules/**",
]

test_patterns = [
  "**/tests/**",
  "**/test/**",
  "**/*.test.php",
]

[smells]
mode = "comment"

# Required — points to the built-in Qlty plugin registry.
[[source]]
name = "default"
default = true

# PHP static analysis
[[plugin]]
name = "phpstan"
mode = "comment"
config_files = ["phpstan.neon"]
package_file = "composer.json"
package_filters = ["mrpunyapal"]

# Secrets detection
[[plugin]]
name = "trufflehog"
mode = "block"

# Dependency vulnerability scanning
[[plugin]]
name = "osv-scanner"
mode = "block"

# Markdown linting
[[plugin]]
name = "markdownlint"
mode = "comment"

# GitHub Actions workflow linting
[[plugin]]
name = "actionlint"
mode = "comment"

# YAML linting
[[plugin]]
name = "yamllint"
mode = "comment"

# Exclude test fixtures from phpstan — these contain intentional violations
# used as test inputs and should not be statically analyzed.
[[exclude]]
plugins = ["phpstan"]
file_patterns = ["**/tests/Fixtures/**", "**/tests/fixtures/**"]
